<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة نشر المواقع السريعة</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #111827;
            border: 1px solid #1f2937;
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        h2 {
            margin-bottom: 20px;
            color: #38bdf8;
            text-align: center;
            font-size: 24px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #94a3b8;
        }
        textarea {
            width: 100%;
            height: 180px;
            background: #1f2937;
            border: 1px solid #374151;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
            margin-bottom: 20px;
        }
        textarea:focus {
            outline: none;
            border-color: #38bdf8;
        }
        .btn {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>أضف كود موقعك (HTML)</h2>
        <form id="deployForm" action="config.html" method="GET">
            <label for="htmlCode">كود الـ HTML:</label>
            <textarea id="htmlCode" name="code" placeholder="<!DOCTYPE html>&#10;<html>&#10;<head><title>موقعي</title></head>&#10;<body>&#10;    <h1>أهلاً بك في موقعي الحقيقي!</h1>&#10;</body>&#10;</html>" required></textarea>
            
            <button type="submit" class="btn">بدء الإعداد والرفع (Start)</button>
        </form>
    </div>

</body>
</html>
